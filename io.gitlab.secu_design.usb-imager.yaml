id: io.gitlab.secu_design.usb-imager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: usb-imager

# Flathub expects the desktop file and the icons to carry the app ID as their
# name. Both keys belong at the top level, a module ignores them.
rename-desktop-file: usb-imager.desktop
rename-icon: usb-imager

# The cleanup script of the base app reads both. The application uses neither
# QtWebEngine nor numpy, and dropping them saves about 370 MB.
build-options:
  env:
    BASEAPP_DISABLE_NUMPY: '1'
    BASEAPP_REMOVE_WEBENGINE: '1'

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Device access runs through udisks2, which passes the file descriptor over D-Bus.
  - --system-talk-name=org.freedesktop.UDisks2

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  - /app/cleanup-unused.sh

modules:
  - python3-deps.yaml

  - name: usb-imager
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 io.gitlab.secu_design.usb-imager.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 LICENSE -t /app/share/licenses/io.gitlab.secu_design.usb-imager/
      # Runs during the cleanup phase and deletes itself at the end.
      - install -Dm755 cleanup-unused.sh /app/cleanup-unused.sh
    sources:
      # Flathub pins both the tag and its commit so a build stays
      # reproducible even if the tag is ever force-moved on GitLab.
      - type: git
        url: https://gitlab.com/secu-design/usb-imager.git
        tag: '4.1.1'
        commit: e57b9d128ee4241991e8e90355c3466b75eeb20b
      # Packaging-only files, not tied to a specific upstream commit, so
      # they live in this repo instead of being fetched from GitLab.
      - type: file
        path: io.gitlab.secu_design.usb-imager.metainfo.xml
      - type: file
        path: cleanup-unused.sh
